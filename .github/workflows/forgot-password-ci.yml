name: Forgot Password Integration CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  forgot-password-flow:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand("ping")'" --health-interval=10s --health-timeout=5s --health-retries=5
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/ci_test_db
          DATABASE_NAME: ci_test_db
          ENVIRONMENT: test
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ""
          SMTP_PASSWORD: ""
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for backend healthy
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:8000/health | grep -q 'ok'; then
              echo 'backend healthy' && break
            fi
            echo 'waiting for backend...' && sleep 2
          done

      - name: Run forgot-password integration script
        working-directory: backend
        env:
          BASE_URL: http://localhost:8000
          MAILHOG_API: http://localhost:8025/api/v2/messages
          TEST_EMAIL: ci-test+forgot@example.com
          TEST_PASSWORD: CiTestPass!234
          NEW_PASSWORD: CiNewPass!234
        run: |
          python scripts/test_forgot_flow.py

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/uvicorn.pid ]; then kill $(cat /tmp/uvicorn.pid) || true; fi
